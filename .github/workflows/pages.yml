name: Publish to GitHub Pages

# Publishes the application on GitHub Pages on every push to main.
# Two jobs (build, then deploy) as recommended by GitHub: the deploy job starts only once the
# site artifact is fully registered, which avoids "No artifacts named github-pages were found".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Prepare the site
        run: |
          mkdir -p _site
          cp dist/CableLoadingPlanner.html _site/index.html
          cp -r dist _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
